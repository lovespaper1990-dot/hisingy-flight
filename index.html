<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HISINGY: RESTORED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800&display=swap');

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none; touch-action: none; /* 阻止移动端默认滑动刷新 */
        }

        #game-wrapper {
            position: relative; width: 960px; height: 540px;
            transform-origin: center center;
            box-shadow: 0 0 120px rgba(0, 200, 255, 0.15);
        }

        #game-container {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: #010103; border: 2px solid #333; overflow: hidden;
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; opacity: 0.8; mix-blend-mode: overlay;
        }

        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 25px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 60;
        }

        .hud-row { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .hud-panel {
            background: rgba(0, 5, 10, 0.7); border: 1px solid rgba(0, 255, 255, 0.1);
            border-top: 3px solid #0ff; padding: 10px 20px;
            backdrop-filter: blur(4px); transform: skewX(-15deg);
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .label { font-size: 10px; color: #0ff; letter-spacing: 2px; margin-bottom: 2px; font-weight: 800; opacity: 0.8; transform: skewX(15deg); }
        .value { font-size: 32px; line-height: 1; color: #fff; font-family: 'Audiowide'; transform: skewX(15deg); text-shadow: 0 0 15px rgba(0,255,255,0.6); }

        .hp-bar { display: flex; gap: 3px; transform: skewX(15deg); margin-top: 5px; }
        .hp-seg { width: 8px; height: 14px; background: #112; border: 1px solid #334; transition: 0.1s; }
        .hp-seg.on { background: #0ff; box-shadow: 0 0 8px #0ff; border-color:#fff; }
        .hp-seg.low { background: #f05; box-shadow: 0 0 12px #f05; border-color:#fff; animation: blink 0.1s infinite; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 4, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        h1 {
            font-family: 'Audiowide'; font-size: 70px; color: #fff; margin: 0;
            text-shadow: 0 0 20px #0ff, 3px 3px 0 #f0f;
            letter-spacing: 5px; animation: glitch 3s infinite;
        }
        
        #player-name {
            background: rgba(0, 255, 255, 0.05); border: 2px solid #0ff; color: #fff;
            font-family: 'Audiowide'; font-size: 24px; padding: 10px 15px;
            text-align: center; margin-bottom: 30px; width: 250px;
            outline: none; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0,255,255,0.2); transition: 0.3s;
        }
        #player-name::placeholder { color: rgba(0, 255, 255, 0.3); }
        #player-name:focus { box-shadow: 0 0 20px rgba(0,255,255,0.5); background: rgba(0, 255, 255, 0.1); }

        .btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            font-family: 'Rajdhani'; font-size: 20px; font-weight: 800; padding: 15px 50px;
            cursor: pointer; margin: 0 15px; transition: 0.2s; position: relative; overflow: hidden;
            text-transform: uppercase; letter-spacing: 3px; min-width: 120px;
        }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .btn-easy { border-color: #0f0; color: #0f0; }
        .btn-easy:hover { background: #0f0; color: #000; box-shadow: 0 0 40px #0f0; }
        .btn-norm { border-color: #ff0; color: #ff0; }
        .btn-norm:hover { background: #ff0; color: #000; box-shadow: 0 0 40px #ff0; }
        .btn-nan { border-color: #f00; color: #f00; }
        .btn-nan:hover { background: #f00; color: #fff; box-shadow: 0 0 50px #f00; }

        /* 触控与平台UI按钮 */
        #touch-ui { position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
        .mobile-btn {
            position: absolute; background: rgba(0, 5, 10, 0.6); border: 2px solid #0ff; color: #0ff;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-family: 'Audiowide'; pointer-events: auto;
            backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(0,255,255,0.3);
            cursor: pointer; transition: 0.1s; user-select: none;
        }
        .mobile-btn:active { transform: scale(0.85); background: rgba(0,255,255,0.2); }
        
        #btn-emp { bottom: 20px; right: 20px; border-color: #f05; color: #f05; width: 80px; height: 80px; font-size: 30px; box-shadow: 0 0 20px rgba(255,0,80,0.4); }
        #btn-emp:active { background: rgba(255,0,80,0.3); }
        #btn-pause { top: 20px; right: 20px; border-color: #ff0; color: #ff0; width: 50px; height: 50px; }
        #btn-fs { top: 20px; right: 85px; border-color: #0f0; color: #0f0; width: 50px; height: 50px; font-size:16px;}

        .leaderboard-box {
            margin-top: 20px; padding: 20px; width: 450px;
            background: rgba(0,0,0,0.6); border: 1px solid #334;
            border-top: 3px solid #0ff; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .lb-title { color: #0ff; font-family: 'Audiowide'; text-align: center; margin-bottom: 15px; letter-spacing: 3px;}
        .lb-row { display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: #ccc; margin-bottom: 8px; border-bottom: 1px dashed #223; padding-bottom: 5px; }
        .lb-row.top1 { color: #ff0; font-weight: bold; font-size: 24px; text-shadow: 0 0 10px #ff0; border-bottom-color: #880; }
        .lb-row .lb-name { flex: 1; text-align: left; text-transform: uppercase; }
        .lb-row .lb-mode { font-size: 14px; opacity: 0.9; width: 90px; text-align: center; color:#0ff; font-weight: bold;}
        .lb-row .lb-score { font-family: 'Audiowide'; width: 120px; text-align: right; }

        #console-log { position: absolute; top: 10px; left: 10px; width: 400px; height: 150px; background: transparent; padding: 10px; font-size: 11px; color: #fff; font-family: monospace; text-align: left; z-index: 200; pointer-events: none; overflow: hidden; display: flex; flex-direction: column-reverse; text-shadow: 1px 1px 0 #000; }
        .log-line { margin-bottom: 2px; }
        .log-err { color: #f05; background: rgba(0,0,0,0.5); }
        .log-ok { color: #0f0; }

        #titan-msg { position: absolute; top: 35%; width: 100%; text-align: center; font-size: 120px; color: #fff; font-family: 'Audiowide'; text-shadow: 0 0 60px #f05; display: none; z-index: 20; letter-spacing: 10px; mix-blend-mode: overlay; animation: pulse 0.1s infinite; }
        .nan-msg { font-size: 28px; font-weight: bold; margin-bottom: 10px; background: linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff); background-size: 400% 400%; -webkit-background-clip: text; color: transparent; animation: rainbow 5s ease infinite; font-family: "Microsoft YaHei", sans-serif; }

        @keyframes glitch { 0%{transform:skew(0deg)} 20%{transform:skew(-5deg)} 22%{transform:skew(5deg)} 24%{transform:skew(0deg)} }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-filters@5.2.1/dist/pixi-filters.js"></script>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container">
        <div class="scanlines"></div>
        <div id="game-view"></div>
        
        <div id="console-log"></div>

        <div id="ui-layer">
            <div class="hud-row">
                <div class="hud-panel" style="pointer-events: auto;">
                    <div class="label" style="color:#fff; font-size:16px; margin-bottom:8px;" id="ui-player-display">GUEST</div>
                    <div class="label">SHIELD</div>
                    <div class="hp-bar" id="hp-bar"></div>
                </div>
                <div class="hud-panel" style="text-align: right; border-color:#f0f; border-top:none; border-bottom:3px solid #f0f;">
                    <div class="label" style="color:#f0f;">SCORE</div>
                    <div class="value" id="ui-score">000000</div>
                    <div class="label" style="margin-top:5px; color:#aaa;">DISTANCE</div>
                    <div class="value" style="font-size:18px; color:#aaa;" id="ui-dist">0 KM</div>
                </div>
            </div>
            <div class="hud-panel" style="margin-top: auto; align-self: flex-start; border-color:#f05; border-top:none; border-left:4px solid #f05;">
                <div class="label" style="color:#f05;">EMP</div>
                <div class="value" style="color:#f05; letter-spacing:5px;" id="ui-bomb">☢☢☢</div>
            </div>
        </div>

        <div id="touch-ui">
            <div id="btn-fs" class="mobile-btn" onpointerdown="toggleFullscreen(); event.stopPropagation();" title="Fullscreen [F]">🖵</div>
            <div id="btn-pause" class="mobile-btn" onpointerdown="togglePause(); event.stopPropagation();" title="Pause [V]">⏸</div>
            <div id="btn-emp" class="mobile-btn" onpointerdown="triggerEMP(); event.stopPropagation();" title="EMP Bomb [B]">☢</div>
        </div>

        <div id="titan-msg">TITAN MODE</div>

        <div id="menu-screen" class="overlay">
            <h1>HISINGY</h1>
            <div style="font-size:16px; color:#888; letter-spacing:10px; margin-bottom:30px;">RESTORED</div>
            
            <input type="text" id="player-name" maxlength="12" placeholder="ENTER NAME" oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,'')">

            <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
                <button class="btn btn-easy" onclick="selectDifficulty(1)">EASY</button>
                <button class="btn btn-norm" onclick="selectDifficulty(2)">NORMAL</button>
                <button class="btn btn-nan" onclick="selectDifficulty(3)">NAN MODE</button>
            </div>
        </div>

        <div id="loader-screen" class="overlay" style="display:none;">
            <h1 style="font-size:50px;">LOADING...</h1>
            <div id="load-status" style="color:#888; margin-bottom:20px;">CONNECTING</div>
            
            <div id="manual-load-ui" style="display:none; text-align:center;">
                <p style="color:#f05; font-size:12px; margin-bottom:10px;">AUTO-LOAD FAILED</p>
                <button class="btn" style="border-color:#aaa; color:#aaa; font-size:14px;">
                    MANUAL LOAD
                    <input type="file" id="file-input" multiple accept=".png,.jpg,.wav,.mp3">
                </button>
            </div>
            
            <div style="width: 400px; height: 4px; background: #333;">
                <div id="loading-bar" style="width: 0%; height: 100%; background: #0f0; transition: width 0.1s;"></div>
            </div>
            <button class="btn" id="start-btn" onclick="startGame()" style="display:none; margin-top:30px; border-color:#0f0; color:#0f0; box-shadow:0 0 30px #0f0;">>>> START <<<</button>
        </div>

        <div id="pause-screen" class="overlay" style="display:none; background:rgba(0,0,0,0.8);">
            <h1 style="font-size:80px; animation:none;">PAUSED</h1>
            <div style="margin-top:20px; font-size:24px; letter-spacing:2px; text-align:center;">
                PRESS [V] / [START] OR <br><span style="color:#ff0; cursor:pointer;" onclick="togglePause()">TAP HERE TO RESUME</span>
            </div>
        </div>

        <div id="game-over-screen" class="overlay" style="display:none;">
            <h1 style="color:#f05; font-size:80px;">DEFEATED</h1>
            <div id="nan-msg" class="nan-msg" style="display:none;">我们只做楠的事！不做简单的事！</div>
            <div style="font-size:30px;">SCORE: <span id="final-score" style="color:#fff;">0</span></div>
            
            <div class="leaderboard-box" id="leaderboard-container"></div>
            <button class="btn" onclick="returnToMenu()" style="margin-top:30px;">REBOOT</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. 配置 & 适配 & 全平台输入系统
// ==========================================
PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST;
PIXI.settings.ROUND_PIXELS = true;

const TARGET_SIZES = { P: 64, E_S: 48, E_M: 64, E_L: 128, E_XS: 32, ITEM: 48, BULLET_P: 48, BULLET_E: 32 };
const C = { C:0x00FFFF, M:0xFF00FF, Y:0xFFFF00, R:0xFF3333, G:0x39FF14, O:0xFFA500, W:0xFFFFFF };
let difficulty = 2;
let assetsReady = false; 
let currentPlayerName = "GUEST"; 
const modeText = {1: 'EASY', 2: 'NORMAL', 3: 'NAN'}; 
let fallbackBoard = [];

// 输入状态存储
const inputState = { mx: 0, my: 0, shoot: false };
let touchActive = false;
let touchStartX = 0, touchStartY = 0;
let playerStartX = 0, playerStartY = 0;
let gpEmpPressed = false;
let gpPausePressed = false;

function log(msg, type='ok') {
    const el = document.getElementById('console-log');
    if(el) {
        const d = document.createElement('div');
        d.innerText = `> ${msg}`;
        d.className = type==='err' ? 'log-line log-err' : 'log-line log-ok';
        el.prepend(d);
        if(el.children.length > 8) el.lastChild.remove();
    }
}

function resizeGame() {
    const wrapper = document.getElementById('game-wrapper');
    const winW = window.innerWidth, winH = window.innerHeight;
    const scale = Math.min(winW / 960, winH / 540);
    wrapper.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);
resizeGame();

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => log(`FS Error: ${err.message}`, 'err'));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

// 触摸事件绑定
const gw = document.getElementById('game-wrapper');
gw.addEventListener('touchstart', e => {
    if(state !== 'PLAY') return;
    e.preventDefault(); // 阻止浏览器滚动
    touchActive = true; 
    inputState.shoot = true;
    const t = e.touches[0];
    const rect = gw.getBoundingClientRect();
    const scaleX = 960 / rect.width;
    const scaleY = 540 / rect.height;
    touchStartX = (t.clientX - rect.left) * scaleX;
    touchStartY = (t.clientY - rect.top) * scaleY;
    playerStartX = player.x; 
    playerStartY = player.y;
}, {passive: false});

gw.addEventListener('touchmove', e => {
    if(!touchActive || state !== 'PLAY') return;
    e.preventDefault();
    const t = e.touches[0];
    const rect = gw.getBoundingClientRect();
    const scaleX = 960 / rect.width;
    const scaleY = 540 / rect.height;
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top) * scaleY;
    // 相对拖拽逻辑：手指移动距离直接映射为飞机位移
    player.x = Math.max(40, Math.min(920, playerStartX + (tx - touchStartX)));
    player.y = Math.max(40, Math.min(500, playerStartY + (ty - touchStartY)));
}, {passive: false});

gw.addEventListener('touchend', e => {
    if(e.touches.length === 0) { touchActive = false; inputState.shoot = false; }
});


function getScale(tex, target) { return target / Math.max(tex.width, tex.height); }

function selectDifficulty(mode) {
    let inputVal = document.getElementById('player-name').value.trim();
    currentPlayerName = inputVal !== "" ? inputVal.toUpperCase() : "GUEST";
    document.getElementById('ui-player-display').innerText = currentPlayerName;
    difficulty = mode;
    document.getElementById('menu-screen').style.display='none';
    
    // 如果是手机端，可以在选择难度后自动全屏 (可选体验增强)
    if(window.innerWidth < 960 && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e=>{});
    }

    if(assetsReady) startGame();
    else { document.getElementById('loader-screen').style.display='flex'; Assets.autoLoad(); }
}

function returnToMenu() {
    state='MENU'; AudioSys.stopBGM();
    gameLayer.removeChildren(); fxLayer.removeChildren(); trailLayer.removeChildren();
    document.getElementById('game-over-screen').style.display='none';
    document.getElementById('ui-layer').style.display='none';
    document.getElementById('menu-screen').style.display='flex';
}

function togglePause() {
    if (state === 'PLAY') { 
        state = 'PAUSED'; AudioSys.suspend(); 
        document.getElementById('pause-screen').style.display = 'flex'; 
    } else if (state === 'PAUSED') { 
        state = 'PLAY'; AudioSys.resume(); 
        document.getElementById('pause-screen').style.display = 'none'; 
    }
}

function triggerEMP() {
    if(player.bombs>0 && state==='PLAY') {
        player.bombs--; AudioSys.play('emp'); flash=0.8; shake=60;
        enemies.forEach(e => { score+=e.score; createExplosion(e.x,e.y,C.C, 3); gameLayer.removeChild(e); });
        enemies=[]; ebullets.forEach(b => b.parent.removeChild(b)); ebullets=[];
    }
}

function saveScoreAndGetBoard() {
    let board = [];
    try { board = JSON.parse(localStorage.getItem('hisingy_scores')) || []; } 
    catch (e) { board = fallbackBoard; }
    
    board.push({ name: currentPlayerName, score: Math.floor(score), mode: modeText[difficulty] });
    board.sort((a, b) => b.score - a.score);
    board = board.slice(0, 3);
    
    try { localStorage.setItem('hisingy_scores', JSON.stringify(board)); } 
    catch (e) { fallbackBoard = board; }
    return board;
}

function renderLeaderboard() {
    const board = saveScoreAndGetBoard();
    const container = document.getElementById('leaderboard-container');
    container.innerHTML = '<div class="lb-title">HALL OF FAME</div>';
    board.forEach((record, index) => {
        let row = document.createElement('div');
        row.className = index === 0 ? 'lb-row top1' : 'lb-row';
        row.innerHTML = `<span class="lb-name">#${index+1} ${record.name}</span><span class="lb-mode">[${record.mode}]</span><span class="lb-score">${record.score}</span>`;
        container.appendChild(row);
    });
}

// ==========================================
// 2. 资源加载
// ==========================================
const ASSET_LIST = [
    'player.png','player_up.png','player_down.png','player_titan.png',
    'bg_far.png','bg_mid.png','bg_near.png', 'item_box.png', 
    'enemy_scout.png','enemy_turret.png','enemy_interceptor.png','enemy_heavy.png','enemy_swarm.png',
    'shoot.wav','boom.wav','power.wav','titan.wav','emp.wav','bgm.wav' 
];

const Assets = { tex:{}, snd:{}, 
    autoLoad() {
        log("AUTO-LOADING...");
        let loaded = 0, total = ASSET_LIST.length, failed = false;
        ASSET_LIST.forEach(file => {
            const path = `assets/${file}`;
            const isImg = file.endsWith('.png');
            const onDone = () => { loaded++; document.getElementById('loading-bar').style.width = (loaded/total)*100 + '%'; if(loaded >= total) this.finishLoad(failed); };
            if(isImg) {
                PIXI.Texture.fromURL(path).then(t => {
                    if(t.width > 1) { this.process(file, t, true); log(`OK: ${file}`); } else { log(`EMPTY: ${file}`, 'err'); failed=true; }
                    onDone();
                }).catch(() => { log(`MISSING: ${file}`, 'err'); failed=true; onDone(); });
            } else {
                fetch(path).then(r=>{if(r.ok)return r.arrayBuffer();throw 404;}).then(buf=>AudioSys.ctx.decodeAudioData(buf, b=>{
                    this.process(file, b, false); log(`OK: ${file}`); onDone();
                }, ()=>onDone())).catch(()=>{ log(`MISSING: ${file}`, 'err'); failed=true; onDone(); });
            }
        });
        setTimeout(() => { if(!assetsReady) { log("TIMEOUT.", 'err'); this.finishLoad(true); } }, 3000);
    },
    manualLoad(files) {
        let cnt=0; document.getElementById('manual-load-ui').style.display='none'; log(`MANUAL: ${files.length} FILES`);
        Array.from(files).forEach(f => {
            const url = URL.createObjectURL(f);
            if(f.name.endsWith('.png')) { PIXI.Texture.fromURL(url).then(t => { this.process(f.name, t, true); check(); }); } 
            else if(f.name.endsWith('.wav') || f.name.endsWith('.mp3')) {
                const r = new FileReader(); r.onload = e => AudioSys.ctx.decodeAudioData(e.target.result, b => { this.process(f.name, b, false); check(); }); r.readAsArrayBuffer(f);
            } else check();
        });
        const check = () => { cnt++; if(cnt>=files.length) this.finishLoad(false); };
    },
    finishLoad(hasError) {
        if(assetsReady) return; assetsReady = true;
        if(hasError) { log("PARTIAL LOAD. FORCE START.", 'warn'); document.getElementById('manual-load-ui').style.display='block'; document.getElementById('start-btn').style.display='inline-block'; } 
        else { log("READY.", 'ok'); document.getElementById('start-btn').style.display='inline-block'; }
    },
    process(name, data, isImg) {
        const n = name.toLowerCase();
        if(isImg) {
            if(n.includes('player.png')) this.tex['P'] = data; else if(n.includes('player_up')) this.tex['P_UP'] = data; else if(n.includes('player_down')) this.tex['P_DOWN'] = data; else if(n.includes('player_titan')) this.tex['P_TITAN'] = data; else if(n.includes('bg_far')) this.tex['BG_FAR'] = data; else if(n.includes('bg_mid')) this.tex['BG_MID'] = data; else if(n.includes('bg_near')) this.tex['BG_NEAR'] = data; else if(n.includes('scout')) this.tex['E0'] = data; else if(n.includes('turret')) this.tex['E1'] = data; else if(n.includes('interceptor')) this.tex['E2'] = data; else if(n.includes('heavy')) this.tex['E3'] = data; else if(n.includes('swarm')) this.tex['E4'] = data; else if(n.includes('item_box')) this.tex['ITEM'] = data;
        } else {
            if(n.includes('shoot')) AudioSys.bufs['shoot']=data; else if(n.includes('boom')) AudioSys.bufs['boom']=data; else if(n.includes('power')) AudioSys.bufs['power']=data; else if(n.includes('titan')) AudioSys.bufs['titan']=data; else if(n.includes('emp')) AudioSys.bufs['emp']=data; else if(n.includes('bgm')) AudioSys.bufs['bgm']=data;
        }
    }
};
document.getElementById('file-input').addEventListener('change', e=>Assets.manualLoad(e.target.files));

const AudioSys = {
    ctx: new (window.AudioContext||window.webkitAudioContext)(), bufs:{}, bgm:null,
    play(k, loop=false) {
        if(!this.bufs[k]) return;
        const s=this.ctx.createBufferSource(); s.buffer=this.bufs[k]; s.loop=loop;
        const g=this.ctx.createGain(); g.gain.value=k=='bgm'?0.4:0.5;
        s.connect(g); g.connect(this.ctx.destination); s.start(0);
        if(k=='bgm') this.bgm=s;
    },
    stopBGM(){if(this.bgm){this.bgm.stop(); this.bgm=null;}}, suspend(){ if(this.ctx.state==='running') this.ctx.suspend(); }, resume(){ if(this.ctx.state==='suspended') this.ctx.resume(); }
};

// ==========================================
// 3. 高级绘制 (Code Generated Assets)
// ==========================================
function createGlowingBullet(color, isEnemy) {
    const g = new PIXI.Graphics(); g.beginFill(color, 0.4); if(isEnemy) g.drawCircle(0,0, 12); else g.drawEllipse(0,0, 20, 8); g.endFill(); g.beginFill(0xFFFFFF); if(isEnemy) g.drawCircle(0,0, 6); else g.drawEllipse(0,0, 12, 4); g.endFill(); return app.renderer.generateTexture(g);
}
function createRectTex(w,h,c) { const g = new PIXI.Graphics(); g.beginFill(c); g.lineStyle(2,0xFFFFFF); g.drawRect(0,0,w,h); g.endFill(); return app.renderer.generateTexture(g); }
function initDefaults() {
    Assets.tex['B_P'] = createGlowingBullet(C.C, false); Assets.tex['B_E'] = createGlowingBullet(C.R, true);
    if(!Assets.tex['P']) Assets.tex['P'] = createRectTex(40,20,C.C); if(!Assets.tex['P_UP']) Assets.tex['P_UP'] = Assets.tex['P']; if(!Assets.tex['P_DOWN']) Assets.tex['P_DOWN'] = Assets.tex['P']; if(!Assets.tex['ITEM']) Assets.tex['ITEM'] = createRectTex(30,30,C.Y);
    const cols = [C.G, C.R, C.C, C.O, C.M]; for(let i=0;i<5;i++) if(!Assets.tex['E'+i]) Assets.tex['E'+i] = createRectTex(40,40,cols[i]);
}

// ==========================================
// 4. 引擎核心
// ==========================================
let app, stage, bgLayer, trailLayer, gameLayer, fxLayer, bloomFilter, rgbSplit;
let player, bullets=[], ebullets=[], enemies=[], items=[], particles=[], backgrounds=[], afterImages=[];
let state='MENU', score=0, dist=0, speed=1.0, shake=0, flash=0, time=0;
const keys={};

window.onload = function() {
    app = new PIXI.Application({ width:960, height:540, backgroundColor:0x050508, antialias:false, resolution: window.devicePixelRatio || 1, autoDensity: true });
    document.getElementById('game-view').appendChild(app.view); stage = new PIXI.Container(); app.stage.addChild(stage);
    bgLayer = new PIXI.Container(); stage.addChild(bgLayer); trailLayer = new PIXI.Container(); stage.addChild(trailLayer); gameLayer = new PIXI.Container(); stage.addChild(gameLayer); fxLayer = new PIXI.Container(); stage.addChild(fxLayer);
    try { 
        if(PIXI.filters) { bloomFilter = new PIXI.filters.AdvancedBloomFilter({threshold:0.3, bloomScale:1.5, brightness:1.2, blur:6, quality:5}); rgbSplit = new PIXI.filters.RGBSplitFilter(); rgbSplit.red = {x:0,y:0}; rgbSplit.blue = {x:0,y:0}; rgbSplit.green = {x:0,y:0}; stage.filters = [bloomFilter, rgbSplit]; }
    } catch(e){}
    initDefaults(); const hpCon = document.getElementById('hp-bar'); for(let i=0; i<20; i++) { hpCon.appendChild(document.createElement('div')).className = 'hp-seg on'; } app.ticker.add(loop);
};

function createParallax() {
    bgLayer.removeChildren(); backgrounds = [];
    if (Assets.tex['BG_FAR']) {
        const layers = [{t:'BG_FAR',s:0.2}, {t:'BG_MID',s:1.0}, {t:'BG_NEAR',s:2.5}];
        layers.forEach(l => { if(!Assets.tex[l.t]) return; const bg = new PIXI.TilingSprite(Assets.tex[l.t], 960, 540); if(Assets.tex[l.t].height > 0) bg.tileScale.set(1, 540/Assets.tex[l.t].height); bg.scrollSpeed = l.s; bgLayer.addChild(bg); backgrounds.push(bg); });
    } else { const g = new PIXI.Graphics(); g.lineStyle(2, 0x111133); for(let i=0; i<1000; i+=50) g.moveTo(i,0).lineTo(i,540); for(let i=0; i<600; i+=50) g.moveTo(0,i).lineTo(960,i); bgLayer.addChild(g); }
}

function startGame() {
    document.getElementById('console-log').style.display = 'none';
    AudioSys.ctx.resume(); AudioSys.play('bgm', true);
    document.getElementById('loader-screen').style.display='none'; document.getElementById('ui-layer').style.display='flex';
    initDefaults(); resetGame();
}

function resetGame() {
    AudioSys.stopBGM(); AudioSys.play('bgm', true); document.getElementById('game-over-screen').style.display='none';
    gameLayer.removeChildren(); trailLayer.removeChildren(); fxLayer.removeChildren(); createParallax();
    bullets=[]; ebullets=[]; enemies=[]; items=[]; particles=[]; afterImages=[]; score=0; dist=0; speed=1.0;
    player = new PIXI.Sprite(Assets.tex['P']); player.anchor.set(0.5); player.x=100; player.y=270;
    let s = getScale(Assets.tex['P'], TARGET_SIZES.P); player.scale.set(s); player.baseScale = s;
    player.hp=100; player.bombs=3; player.weapon=1; player.cd=0; player.titan=0; player.inv=0;
    const shield = new PIXI.Graphics(); shield.lineStyle(2, C.C); shield.drawCircle(0,0, 50); shield.alpha = 0; player.shieldGfx = shield; player.addChild(shield);
    gameLayer.addChild(player); state='PLAY'; 
}

function spawnEnemy() {
    let baseSpawn = 0.015; if(difficulty === 1) baseSpawn = 0.008; if(difficulty === 3) baseSpawn = 0.038; 
    if(Math.random() >= baseSpawn * speed * (app.ticker.deltaMS/16.6)) return;
    const id = Math.floor(Math.random()*5); const tex = Assets.tex['E'+id]; if(!tex) return;
    const s = [{h:2,v:6,sc:100},{h:5,v:3,sc:300},{h:4,v:5,sc:200},{h:30,v:1.0,sc:1000},{h:1,v:7,sc:150}][id];
    if(difficulty === 1) s.v *= 0.7; if(difficulty === 3) s.v *= 1.2; 
    if(id === 4) { 
        const baseY = 50 + Math.random()*440; let scale = getScale(tex, TARGET_SIZES.E_XS); 
        for(let k=0; k<3; k++) { const e = new PIXI.Sprite(tex); e.anchor.set(0.5); e.scale.set(scale); e.x = 1000 + k*40; e.y = baseY + (k===1 ? -30 : (k===2 ? 30 : 0)); e.t=0; e.hp=s.h; e.vx=s.v; e.score=s.sc; e.id=id; e.squad = Math.random(); enemies.push(e); gameLayer.addChildAt(e, 0); }
    } else {
        const e = new PIXI.Sprite(tex); e.anchor.set(0.5); e.x=1000; e.y = 60 + Math.random()*420; let scale = getScale(tex, id===3 ? TARGET_SIZES.E_L : (id===0 ? TARGET_SIZES.E_S : TARGET_SIZES.E_M)); e.scale.set(scale); e.t=0; e.hp=s.h; e.vx=s.v; e.score=s.sc; e.id=id; enemies.push(e); gameLayer.addChildAt(e, 0);
    }
}

function createExplosion(x, y, color, size=1) {
    const flash = new PIXI.Graphics(); flash.beginFill(0xFFFFFF); flash.drawCircle(0,0, 30*size); flash.endFill(); flash.x=x; flash.y=y; flash.life=0.1; flash.type='flash'; flash.blendMode=PIXI.BLEND_MODES.ADD; fxLayer.addChild(flash); particles.push(flash);
    const wave = new PIXI.Graphics(); wave.lineStyle(4, color); wave.drawCircle(0,0, 10*size); wave.x=x; wave.y=y; wave.life=0.4; wave.type='wave'; wave.blendMode = PIXI.BLEND_MODES.ADD; fxLayer.addChild(wave); particles.push(wave);
    const count = 16 * size;
    for(let i=0; i<count; i++) { let p = new PIXI.Graphics(); p.beginFill(color); p.drawRect(-2,-2,4,4); p.x=x; p.y=y; const a = Math.random()*6.28; const s = Math.random()*10+2; p.vx = Math.cos(a)*s; p.vy = Math.sin(a)*s; p.life = 1.0; p.decay = Math.random()*0.05 + 0.02; p.rotationSpeed = (Math.random()-0.5)*0.5; p.blendMode = PIXI.BLEND_MODES.ADD; fxLayer.addChild(p); particles.push(p); }
}

function createGhost(target) { const ghost = new PIXI.Sprite(target.texture); ghost.anchor.set(0.5); ghost.x = target.x; ghost.y = target.y; ghost.scale.copyFrom(target.scale); ghost.rotation = target.rotation; ghost.alpha = 0.5; ghost.tint = target.titan>0 ? C.O : C.C; ghost.blendMode = PIXI.BLEND_MODES.ADD; trailLayer.addChild(ghost); afterImages.push(ghost); }

function getRainbowColor(t) { const r = Math.sin(t)*127+128; const g = Math.sin(t+2)*127+128; const b = Math.sin(t+4)*127+128; return (r<<16)|(g<<8)|b; }

function loop(delta) {
    // 处理手柄输入
    inputState.mx = 0; inputState.my = 0; inputState.shoot = false;
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[0];
    if (gp) {
        if (Math.abs(gp.axes[0]) > 0.2) inputState.mx = gp.axes[0];
        if (Math.abs(gp.axes[1]) > 0.2) inputState.my = gp.axes[1];
        if (gp.buttons[14]?.pressed) inputState.mx = -1; 
        if (gp.buttons[15]?.pressed) inputState.mx = 1;  
        if (gp.buttons[12]?.pressed) inputState.my = -1; 
        if (gp.buttons[13]?.pressed) inputState.my = 1;  
        if (gp.buttons[0]?.pressed || gp.buttons[7]?.pressed) inputState.shoot = true;
        
        if (gp.buttons[1]?.pressed || gp.buttons[3]?.pressed) {
            if (!gpEmpPressed) { triggerEMP(); gpEmpPressed = true; }
        } else { gpEmpPressed = false; }
        
        if (gp.buttons[9]?.pressed) {
            if (!gpPausePressed) { togglePause(); gpPausePressed = true; }
        } else { gpPausePressed = false; }
    }

    if(state === 'PAUSED') return; 
    if(state!=='PLAY') return;
    
    time += 0.1 * delta; dist += 0.5 * speed * delta; speed = 1.0 + dist/8000;
    
    if(shake>0) { stage.position.set((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake*=0.9; if(rgbSplit) { rgbSplit.red = {x: shake/2, y: 0}; rgbSplit.blue = {x: -shake/2, y: 0}; } } else if(rgbSplit) { rgbSplit.red = {x:0,y:0}; rgbSplit.blue = {x:0,y:0}; }
    if(flash>0) { const f = new PIXI.Graphics(); f.beginFill(0xffffff, flash); f.drawRect(0,0,960,540); fxLayer.addChild(f); setTimeout(()=>fxLayer.removeChild(f), 50); flash=0; }

    let spd = player.titan>0 ? 9 : 6;
    let my=0, mx=0; 
    if(keys['ArrowUp']||keys['w']) my=-1; if(keys['ArrowDown']||keys['s']) my=1;
    if(keys['ArrowLeft']||keys['a']) mx=-1; if(keys['ArrowRight']||keys['d']) mx=1;
    
    // 合并手柄摇杆与键盘输入
    if(inputState.mx !== 0) mx = inputState.mx;
    if(inputState.my !== 0) my = inputState.my;

    // 只有在未触摸拖拽的情况下，才应用键盘和手柄的移动逻辑
    if(!touchActive) {
        player.x += mx*spd*delta; player.y += my*spd*delta;
        player.x=Math.max(40,Math.min(920,player.x)); player.y=Math.max(40,Math.min(500,player.y));
    }

    let targetTex = Assets.tex['P']; let targetScale = player.baseScale;
    if(player.titan > 0) { if(Assets.tex['P_TITAN']) targetTex = Assets.tex['P_TITAN']; targetScale = 2.5; } else { if(my < 0 && Assets.tex['P_UP']) targetTex = Assets.tex['P_UP']; else if(my > 0 && Assets.tex['P_DOWN']) targetTex = Assets.tex['P_DOWN']; }
    if(player.texture !== targetTex) player.texture = targetTex; player.scale.x += (targetScale - player.scale.x) * 0.1; player.scale.y += (targetScale - player.scale.y) * 0.1;
    if(speed > 1.5 || player.titan > 0) { if(Math.random() > 0.5) createGhost(player); }

    if(player.inv > 0) { player.shieldGfx.alpha = 0.6+Math.sin(time*2)*0.4; player.visible = Math.floor(time*2)%2; } else { player.shieldGfx.alpha = 0; player.visible = true; }

    if(player.cd>0) player.cd-=delta;
    if((keys[' '] || inputState.shoot || touchActive) && player.cd<=0) {
        const tex = Assets.tex['B_P']; const b = new PIXI.Sprite(tex); b.anchor.set(0.5); b.x=player.x+40*player.scale.x; b.y=player.y; b.scale.set(getScale(tex, TARGET_SIZES.BULLET_P)); b.tint = getRainbowColor(time); b.blendMode = PIXI.BLEND_MODES.ADD; bullets.push(b); fxLayer.addChild(b); 
        if(player.weapon>=2) { const b2=new PIXI.Sprite(tex); b2.anchor.set(0.5); b2.x=player.x; b2.y=player.y-15; b2.vy=-2; b2.scale.copyFrom(b.scale); b2.tint=b.tint; b2.blendMode=PIXI.BLEND_MODES.ADD; bullets.push(b2); fxLayer.addChild(b2); }
        if(player.weapon>=3) { const b3=new PIXI.Sprite(tex); b3.anchor.set(0.5); b3.x=player.x; b3.y=player.y+15; b3.vy=2; b3.scale.copyFrom(b.scale); b3.tint=b.tint; b3.blendMode=PIXI.BLEND_MODES.ADD; bullets.push(b3); fxLayer.addChild(b3); }
        player.cd=8; AudioSys.play('shoot');
    }
    
    const p = new PIXI.Graphics(); p.beginFill(player.titan>0 ? C.O : C.C); p.drawRect(0,0,4,4); p.x=player.x - 30 * player.scale.x; p.y=player.y+(Math.random()-0.5)*10; p.vx=-10-Math.random()*5; p.life=1.0; p.decay=0.08; p.blendMode=PIXI.BLEND_MODES.ADD; particles.push(p); trailLayer.addChild(p);

    if(backgrounds.length > 0) backgrounds.forEach(bg => { bg.tilePosition.x -= bg.scrollSpeed * speed * delta; });

    spawnEnemy();

    for(let i=enemies.length-1; i>=0; i--) {
        const e = enemies[i]; e.x -= e.vx * speed * delta; e.t += 0.05 * delta;
        if(e.id==2) e.y += Math.sin(e.t)*2; if(e.id==4) e.y += Math.sin(time + e.squad)*1.5; 
        let shootBase = difficulty === 1 ? 0.005 : (difficulty === 3 ? 0.05 : 0.015);
        let finalChance = difficulty === 3 && e.x > 800 ? 0.1 : shootBase;
        if(e.id!==4 && (e.id==1 || e.id==3 || difficulty===3) && Math.random() < finalChance * delta) {
            const eb = new PIXI.Sprite(Assets.tex['B_E']); eb.anchor.set(0.5); eb.x = e.x-30; eb.y = e.y; eb.scale.set(getScale(Assets.tex['B_E'], TARGET_SIZES.BULLET_E)); eb.blendMode=PIXI.BLEND_MODES.ADD;
            const dx=player.x-eb.x, dy=player.y-eb.y, d=Math.sqrt(dx*dx+dy*dy); let bSpd = difficulty === 1 ? 5 : 7; eb.vx=(dx/d)*bSpd; eb.vy=(dy/d)*bSpd; ebullets.push(eb); fxLayer.addChild(eb);
        }
        
        let hitB = false; let radius = e.width * 0.4; 
        for(let j=bullets.length-1; j>=0; j--) { if(hit(bullets[j], e, radius)) { e.hp -= (player.titan>0?10:1); createExplosion(bullets[j].x, bullets[j].y, C.W, 0.5); bullets[j].parent.removeChild(bullets[j]); bullets.splice(j,1); hitB = true; if(e.hp<=0) break; } }
        if(!hitB && hit(player,e, radius + 20)) { if(player.titan>0) { e.hp=0; score+=500; shake=25; createExplosion(e.x, e.y, C.O, 2); } else if(player.inv<=0) { player.hp-=20; e.hp=0; shake=30; AudioSys.play('boom'); createExplosion(e.x, e.y, C.R, 2); } }
        if(e.hp<=0) {
            score+=e.score; AudioSys.play('boom'); createExplosion(e.x, e.y, e.id===3?C.R:C.G, e.id===3?3:1.5);
            if(Math.random()<0.25) { let r=Math.random(); let type = r<0.1?'GIANT':(r<0.25?'STAR':'WP'); if(Assets.tex['ITEM']) { const it = new PIXI.Sprite(Assets.tex['ITEM']); it.anchor.set(0.5); it.x=e.x; it.y=e.y; it.type=type; it.scale.set(getScale(Assets.tex['ITEM'], TARGET_SIZES.ITEM)); it.tint = type==='WP'?C.Y : (type==='STAR'?C.M : C.C); const beam = new PIXI.Graphics(); beam.beginFill(it.tint, 0.2); beam.drawRect(-4, -600, 8, 1200); it.addChildAt(beam, 0); it.beam=beam; items.push(it); gameLayer.addChild(it); } }
            gameLayer.removeChild(e); enemies.splice(i,1);
        } else if(e.x<-100) { gameLayer.removeChild(e); enemies.splice(i,1); }
    }
    
    for(let i=ebullets.length-1; i>=0; i--) { let b = ebullets[i]; b.x += b.vx * delta; b.y += b.vy * delta; if(hit(player, b, 8)) { if(player.inv<=0 && player.titan<=0) { player.hp-=10; shake=20; AudioSys.play('boom'); createExplosion(b.x,b.y,C.R); } b.parent.removeChild(b); ebullets.splice(i,1); } else if(b.x < -50 || b.y < -50 || b.y > 590) { b.parent.removeChild(b); ebullets.splice(i,1); } }
    
    for(let i=items.length-1; i>=0; i--) {
        let it = items[i]; it.x -= 3*speed*delta; it.y += Math.sin(time*3)*0.5; it.beam.alpha = 0.3 + Math.sin(time*10)*0.2;
        if(hit(player, it, 40)) { AudioSys.play('power'); if(it.type=='WP') { if(player.weapon<3)player.weapon++; else score+=500; } else if(it.type=='STAR') player.inv=300; else if(it.type=='GIANT') { player.titan=300; AudioSys.play('titan'); } gameLayer.removeChild(it); items.splice(i,1); } else if(it.x < -50) { gameLayer.removeChild(it); items.splice(i,1); }
    }
    
    for(let i=particles.length-1; i>=0; i--) { const p = particles[i]; if(p.type==='wave') { p.scale.x+=0.1*delta; p.scale.y+=0.1*delta; p.alpha-=0.08*delta; } else if(p.type==='flash') { p.alpha-=0.2*delta; } else { p.x+=p.vx*delta; p.y+=(p.vy||0)*delta; p.rotation+=p.rotationSpeed*delta; p.alpha-=p.decay*delta; } if(p.alpha<=0) { if(p.parent) p.parent.removeChild(p); particles.splice(i,1); } }
    
    for(let i=afterImages.length-1; i>=0; i--) { const g = afterImages[i]; g.alpha -= 0.05 * delta; g.scale.x += 0.02 * delta; g.scale.y += 0.02 * delta; if(g.alpha <= 0) { g.parent.removeChild(g); afterImages.splice(i,1); } }
    
    for(let i=bullets.length-1; i>=0; i--) { let b = bullets[i]; b.x += 25 * delta; b.y += (b.vy||0) * delta; if(b.x > 1000) { b.parent.removeChild(b); bullets.splice(i,1); } }

    if(player.titan>0) player.titan-=delta; if(player.inv>0) player.inv-=delta;
    document.getElementById('ui-score').innerText = Math.floor(score).toString().padStart(6,'0');
    document.getElementById('ui-dist').innerText = Math.floor(dist) + ' KM';
    document.getElementById('ui-bomb').innerText = "☢".repeat(player.bombs);
    document.getElementById('titan-msg').style.display = player.titan>0?'block':'none';
    
    const hpCells = document.querySelectorAll('.hp-seg'); const hpVal = Math.ceil(player.hp/5);
    hpCells.forEach((c, i) => { c.className = i < hpVal ? (hpVal<5 ? 'hp-seg on low' : 'hp-seg on') : 'hp-seg'; });

    if(player.hp<=0) {
        state='END'; AudioSys.stopBGM(); document.getElementById('game-over-screen').style.display='flex';
        document.getElementById('final-score').innerText = Math.floor(score);
        const nanMsg = document.getElementById('nan-msg'); if(difficulty === 3) nanMsg.style.display = 'block'; else nanMsg.style.display = 'none';
        renderLeaderboard();
    }
}
function hit(a,b,t) { return Math.abs(a.x-b.x)<t && Math.abs(a.y-b.y)<t; }
window.addEventListener('keydown', e=>{ 
    keys[e.key]=true; 
    if(e.key.toLowerCase()=='b') triggerEMP();
    if(e.key.toLowerCase()=='v') togglePause();
    if(e.key.toLowerCase()=='f') toggleFullscreen();
});
window.addEventListener('keyup', e=>keys[e.key]=false);
</script>
